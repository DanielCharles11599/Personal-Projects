name: Track Brawl Stars Stats

on:
  schedule:
    - cron: '0 10 * * *' # Runs @ 10am SAST
      timezone: "Africa/Johannesburg"
  workflow_dispatch: {}

# Prevents two runs from overlapping and racing to push at the same time.
concurrency:
  group: brawl-tracker
  cancel-in-progress: false

permissions:
  contents: write   # needed so the workflow can commit the updated CSVs back

jobs:
  track:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'Brawl Stars Tracker'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tracker
        env:
          BS_API_TOKEN: ${{ secrets.BS_API_TOKEN }}    # Uses GitHub Secrets to avoid placing config.json in the repo
          BS_PLAYER_TAG: ${{ secrets.BS_PLAYER_TAG }}
        run: python brawl_tracker.py

      - name: Commit and push updated data
        run: |
          git config user.name "brawl-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add brawl_history.csv brawler_history.csv battle_log.csv
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update stats $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase
            git push
          fi
