# Save this file to: .github/workflows/track-stats.yml  in your repo
# (GitHub only picks up workflows that live in that exact folder.)

name: Track Brawl Stars Stats

on:
  schedule:
    - cron: '0 8 * * *' # Runs at 10am SAST
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

# Prevents two runs from overlapping and racing to push at the same time.
concurrency:
  group: brawl-tracker
  cancel-in-progress: false

permissions:
  contents: write   # needed so the workflow can commit the updated CSVs back
  pages: write       # needed to publish to GitHub Pages
  id-token: write    # needed for the official Pages deploy action

jobs:
  track:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'Brawl Stars Tracker'   # <-- files live in this subfolder
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tracker
        env:
          BS_API_TOKEN: ${{ secrets.BS_API_TOKEN }}
          BS_PLAYER_TAG: ${{ secrets.BS_PLAYER_TAG }}
        run: python brawl_tracker.py

      - name: Commit and push updated data
        run: |
          git config user.name "brawl-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add brawl_history.csv brawler_history.csv battle_log.csv catalog.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update stats $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase
            git push
          fi

  deploy-pages:
    needs: track           # only runs once the tracker job above has finished
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        # No ref specified -- this checks out the default branch's latest
        # commit, which by now includes whatever the track job just pushed.

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp "Brawl Stars Tracker/dashboard.html" _site/index.html
          cp "Brawl Stars Tracker/brawl_history.csv" _site/ 2>/dev/null || true
          cp "Brawl Stars Tracker/brawler_history.csv" _site/ 2>/dev/null || true
          cp "Brawl Stars Tracker/battle_log.csv" _site/ 2>/dev/null || true
          cp "Brawl Stars Tracker/catalog.json" _site/ 2>/dev/null || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
