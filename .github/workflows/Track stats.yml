# lives in .github/workflows/track-stats.yml

name: Track Brawl Stars Stats

on:
  schedule:
    # every 3 hours, cron is UTC (we're UTC+2). runs often because the api only
    # returns the last 25 battles
    - cron: '0 */3 * * *'
  workflow_dispatch: {}   # manual run from the Actions tab

# no overlapping runs
concurrency:
  group: brawl-tracker
  cancel-in-progress: false

permissions:
  contents: write   # commit the csvs
  pages: write
  id-token: write

jobs:
  track:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'Brawl Stars Tracker'   # files live in this folder
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tracker
        env:
          BS_API_TOKEN: ${{ secrets.BS_API_TOKEN }}
          BS_PLAYER_TAG: ${{ secrets.BS_PLAYER_TAG }}
        run: python brawl_tracker.py

      - name: Commit and push updated data
        run: |
          git config user.name "brawl-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          for f in brawl_history.csv brawler_history.csv battle_log.csv catalog.json upgrade_log.csv assets.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update stats $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase
            git push
          fi

  deploy-pages:
    needs: track
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment_retry.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # check out main, otherwise we get the commit the run started on and miss the data commit
          ref: main

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp "Brawl Stars Tracker/dashboard.html" _site/index.html
          cp "Brawl Stars Tracker/brawl_history.csv" _site/ 2>/dev/null || true
          cp "Brawl Stars Tracker/brawler_history.csv" _site/ 2>/dev/null || true
          cp "Brawl Stars Tracker/battle_log.csv" _site/ 2>/dev/null || true
          cp "Brawl Stars Tracker/catalog.json" _site/ 2>/dev/null || true
          cp "Brawl Stars Tracker/upgrade_log.csv" _site/ 2>/dev/null || true
          cp "Brawl Stars Tracker/assets.json" _site/ 2>/dev/null || true
          cp "Brawl Stars Tracker/buffie_brawlers.json" _site/ 2>/dev/null || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # sometimes "Found 0 artifact(s)" right after the upload, so retry once
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before retrying deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 45

      - name: Deploy to GitHub Pages (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
